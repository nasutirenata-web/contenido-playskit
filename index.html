<title>Playskit Contenido</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* Layout: panel oscuro tipo dashboard. Barra lateral con iconos, línea de la semana (solo los días), tarjetas con degradé celeste, tabla de la semana. En celular la barra pasa abajo. */
:root{
  --bg:#07090b;--panel:#0e1215;--panel2:#141a1e;--line:#1e272c;--ink:#f1f6f7;--muted:#86949b;
  --cy:#5fe3ea;--cy2:#16b9c6;--sky:#9fd3ff;--paper:#eef3f4;--cardink:#05181c;--ok:#3ddc84;--warn:#f0b34a;
  --g1:linear-gradient(135deg,#0a3a41 0%,#0f6b75 55%,#17c2cf 100%);--g2:linear-gradient(135deg,#0b2441 0%,#12508f 60%,#4aa6ee 100%);--g3:linear-gradient(135deg,#1b2024 0%,#242c31 100%);
  --f-d:"Instrument Serif","Times New Roman",serif;--f-b:"DM Sans",system-ui,sans-serif;--f-m:"DM Mono",ui-monospace,monospace;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-b);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(900px 500px at 80% -10%,rgba(95,227,234,.10),transparent 60%),radial-gradient(700px 500px at 0% 100%,rgba(95,160,238,.07),transparent 60%)}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
aside{position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;background:color-mix(in srgb,var(--panel) 80%,transparent)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;font:400 17.7px var(--f-d)}
.brand i{width:34px;height:34px;border-radius:11px;background:#05090a url(star.jpg) center/110% no-repeat;border:1px solid var(--line);flex:none}
.nv2{display:flex;align-items:center;gap:12px;border:0;background:transparent;color:var(--muted);font:500 14px var(--f-b);padding:12px 14px;border-radius:16px;cursor:pointer;text-align:left;width:100%}
.nv2 svg{width:20px;height:20px;flex:none}
.nv2[aria-selected=true]{background:var(--g1);color:#fff;box-shadow:0 8px 28px rgba(22,185,198,.25)}
aside .sp{flex:1}
.who{margin:0 8px;font:500 12px var(--f-b);color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:6px 12px;text-align:center}
main{padding:22px clamp(14px,3vw,34px) 110px;min-width:0;max-width:1240px;width:100%}
.hd{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.hd h1{margin:0;font:400 clamp(22px,3.6vw,32px)/1.1 var(--f-d)}.hd h1 span{color:var(--cy)}
.hd p{margin:4px 0 0;color:var(--muted);font-weight:600}
.sp2{flex:1}
.btn{background:var(--cy);color:var(--cardink);border:0;border-radius:14px;padding:11px 18px;font:500 14px var(--f-b);cursor:pointer}
.btn.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:7px 13px;font-size:12.5px;border-radius:11px}.btn:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
section[hidden]{display:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px;min-width:0}
/* línea de días */
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:8px}
.dy{border:0;background:transparent;color:var(--ink);padding:12px 2px 10px;cursor:pointer;text-align:center;min-width:0;font-family:var(--f-b);border-radius:16px}
.dy i{display:block;font:400 clamp(22px,4.4vw,34px)/1 var(--f-d);font-style:normal}
.dy b{display:block;font:500 clamp(10px,1.5vw,13px) var(--f-b);color:var(--muted);margin-top:6px;text-transform:capitalize;overflow:hidden;text-overflow:ellipsis}
.dy.out{opacity:.3}.dy.hoy i{color:var(--cy)}
.dy[aria-pressed=true]{background:var(--g1);color:#fff;box-shadow:0 8px 26px rgba(22,185,198,.28)}
.dy[aria-pressed=true] b,.dy[aria-pressed=true] i{color:#fff}
.range{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 2px 16px;color:var(--muted);font-weight:500;font-size:13px}
.range .nv{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:16px;cursor:pointer}
/* números */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:20px}
.st{border-radius:22px;padding:18px;border:1px solid var(--line);position:relative;overflow:hidden;min-height:128px}
.st.a{background:var(--g1);border-color:transparent;color:#fff}.st.b{background:var(--g2);border-color:transparent;color:#fff}.st.c{background:var(--g3)}
.st span{font:500 11px var(--f-b);letter-spacing:.12em;text-transform:uppercase;opacity:.8}
.st b{display:block;font:400 clamp(32px,6vw,46px)/1 var(--f-d);margin-top:8px}.st b small{font-size:.45em;opacity:.7}
.bars{display:flex;gap:5px;align-items:flex-end;height:34px;margin-top:10px}.bars u{flex:1;border-radius:4px;background:rgba(255,255,255,.28);text-decoration:none;min-height:5px}.bars u.on{background:#fff}
.prog{height:8px;border-radius:99px;background:rgba(255,255,255,.25);margin-top:14px;overflow:hidden}.prog i{display:block;height:100%;background:#fff;border-radius:99px}
.ring{position:absolute;right:14px;top:14px;width:74px;height:74px}
h2.s{font:400 18.9px var(--f-d);margin:0 0 12px;display:flex;align-items:center;gap:10px}h2.s small{font:500 13px var(--f-b);color:var(--muted)}
/* tarjetas del día */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px;margin-bottom:22px}
.tk{position:relative;border-radius:24px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;min-width:0;cursor:pointer;text-align:left;font-family:var(--f-b);color:var(--ink);padding:0;overflow:hidden;width:100%}
.tk .hdr{display:flex;align-items:center;gap:6px;padding:14px 14px 12px;color:var(--cardink)}
.tk.v .hdr{background:var(--g1);color:#fff}.tk.p .hdr{background:linear-gradient(135deg,#f4f8f9,#cfe0e3)}.tk.h .hdr{background:var(--g2);color:#fff}
.tk .tag{font:500 10.5px var(--f-b);letter-spacing:.08em;text-transform:uppercase;border-radius:99px;padding:4px 10px;background:rgba(0,0,0,.16)}
.tk.p .tag{background:rgba(5,24,28,.12)}
.tk .bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:9px;flex:1}
.tk h3{margin:0;font:400 20.1px/1.2 var(--f-d);text-wrap:balance}
.tk .hk{font-weight:600;font-size:14px;color:var(--muted)}
.tk .th{display:block;width:96px;aspect-ratio:9/16;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.tk .row{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;margin-top:auto}
.tk .ver{font:500 12.5px var(--f-b);color:var(--cy)}
.ck{margin-left:auto;width:38px;height:38px;border-radius:50%;border:2px solid currentColor;background:transparent;color:inherit;font-size:20px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;opacity:.9}
.ck[aria-pressed=true]{background:var(--ok);border-color:var(--ok);color:#04210f;opacity:1}
.ck:disabled{cursor:default}
.tk.done{opacity:.55}.tk.done h3{text-decoration:line-through;text-decoration-thickness:2px}
.empty{color:var(--muted);padding:22px;border:1px dashed var(--line);border-radius:20px;text-align:center}
/* tablas */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:22px;background:var(--panel)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font:400 12.4px var(--f-d);letter-spacing:.1em;color:var(--muted);text-align:left;padding:14px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.cl{cursor:pointer}tr.cl:hover td{background:var(--panel2)}
.chp{display:inline-block;font:500 10.5px var(--f-m);border-radius:99px;padding:4px 11px;background:var(--panel2);color:var(--muted);white-space:nowrap}
.chp.v{background:rgba(95,227,234,.16);color:var(--cy)}.chp.p{background:rgba(238,243,244,.14);color:var(--paper)}.chp.h{background:rgba(159,211,255,.16);color:var(--sky)}.chp.ok{background:rgba(61,220,132,.16);color:var(--ok)}
.mini{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:transparent;color:transparent;font-weight:500;cursor:pointer;padding:0}
.mini[aria-pressed=true]{background:var(--ok);border-color:var(--ok);color:#04210f}.mini:disabled{cursor:default}
.dbar{height:8px;border-radius:99px;background:var(--panel2);min-width:80px;overflow:hidden}.dbar i{display:block;height:100%;border-radius:99px;background:var(--g1)}
.num{font:400 17.7px var(--f-d)}
/* qué funcionó */
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.bar input[type=search]{flex:1;min-width:200px}
input,select,textarea{width:100%;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font:inherit}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 4px;font-weight:500}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:8px 14px;font:500 13px var(--f-b);cursor:pointer}
.chip[aria-pressed=true]{background:var(--g1);color:#fff;border-color:transparent}
.res{white-space:pre-wrap;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px;font-size:14px}
.note{font-size:13px;color:var(--muted)}
.two{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.hr{background:var(--panel2);border-radius:14px;padding:8px 12px;margin-bottom:6px;font-weight:500}.hr small{display:block;font:400 11.2px var(--f-d);letter-spacing:.14em;color:var(--muted)}
.pill{font:500 12px var(--f-b);border-radius:99px;padding:4px 12px;background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
/* pantalla completa */
dialog{border:0;background:var(--bg);color:var(--ink);width:100vw;height:100vh;max-width:none;max-height:none;margin:0;padding:0;overflow:auto;border-radius:0}
dialog::backdrop{background:#000}
.fs{max-width:1180px;margin:0 auto;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 60px max(16px,env(safe-area-inset-left,0px))}
.fs .bar2{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;background:var(--bg);padding:12px 0;border-bottom:1px solid var(--line)}
.fs .bar2 h2{margin:0;font:400 20.1px/1.2 var(--f-d);flex:1;min-width:0}
.fs .x{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:20px;cursor:pointer;flex:none}
.fs .meta{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.strip{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 2px 18px}
.sl{flex:none;width:min(290px,76vw);aspect-ratio:9/16;border-radius:24px;overflow:hidden;scroll-snap-align:start;display:flex;flex-direction:column;justify-content:space-between;padding:22px;color:var(--cardink);position:relative}
.sl img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sl.t0{background:var(--g1);color:#fff}.sl.t1{background:var(--paper)}.sl.t2{background:var(--g2);color:#fff}.sl.t3{background:#0d1114;color:#f1f6f7;border:1px solid var(--line)}
.sl small{font:500 11px var(--f-b);letter-spacing:.12em;text-transform:uppercase;opacity:.75}
.sl p{margin:0;font:400 clamp(18px,3.6vw,24px)/1.22 var(--f-d);text-wrap:balance}
.sl .ft{display:flex;justify-content:space-between;font:500 10.5px var(--f-b);letter-spacing:.14em;opacity:.7}
.fs .cols{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:16px}
@media(max-width:820px){.fs .cols{grid-template-columns:1fr}}
.fs h4{font:400 13px var(--f-d);letter-spacing:.16em;color:var(--cy);margin:0 0 8px}
.blk{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:12px}
.cap{white-space:pre-wrap;font-weight:600;line-height:1.5}

/* agenda: fila de números y, abajo, fila con los nombres */
.sched{background:var(--panel);border:1px solid var(--line);border-radius:26px;padding:14px 14px 10px;margin-bottom:18px}
.sched .sh{display:flex;align-items:center;gap:10px;margin-bottom:12px}.sched .sh b{font:400 17.7px var(--f-d)}.sched .sh span{color:var(--muted);font-weight:500;font-size:13px}
.sched .nv{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-size:16px;cursor:pointer}
.nums,.nms{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.dn{border:0;background:var(--panel2);color:var(--ink);border-radius:22px;padding:16px 4px;cursor:pointer;font-family:var(--f-b)}
.dn i{display:block;font:400 clamp(24px,5vw,40px)/1 var(--f-d);font-style:normal}
.dn:hover,.dn:focus-visible{background:var(--g1);color:#fff}
.dn.hoy{background:var(--g1);color:#fff;box-shadow:0 8px 26px rgba(22,185,198,.3)}
.dn.all{outline:2px solid var(--ok)}
.dn.out,.dm.out{opacity:.3}
.nms{margin-top:8px}.dm{border:0;background:transparent;color:var(--muted);font:500 clamp(10px,1.6vw,14px) var(--f-b);text-transform:capitalize;padding:8px 2px;cursor:pointer;overflow:hidden;text-overflow:ellipsis}
.dm.hoy{color:var(--cy)}
.dnav{display:flex;gap:8px;flex-wrap:wrap;padding:12px 0}.dnav a{text-decoration:none}
.pb{margin:22px 0 34px;padding:18px;border:1px solid var(--line);border-radius:26px;background:color-mix(in srgb,var(--panel) 70%,transparent)}
.pb h3{margin:14px 0 4px;font:400 clamp(19px,3vw,26px)/1.15 var(--f-d)}
.pbh{display:flex;gap:6px;align-items:center;flex-wrap:wrap}

/* ===== placas de vidrio pegadas a la pared ===== */
:root{--gl:linear-gradient(150deg,rgba(255,255,255,.085),rgba(255,255,255,.025) 60%,rgba(255,255,255,.05));--glb:rgba(255,255,255,.13);--gls:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -1px 0 rgba(0,0,0,.35),0 22px 50px -18px rgba(0,0,0,.7),0 2px 6px rgba(0,0,0,.4);--tint:linear-gradient(150deg,rgba(95,227,234,.20),rgba(22,185,198,.07) 70%)}
body{background:#0a0c0e;background-image:radial-gradient(1200px 700px at 78% -8%,rgba(95,227,234,.10),transparent 60%),radial-gradient(900px 600px at 8% 105%,rgba(120,150,170,.07),transparent 60%),linear-gradient(180deg,#0c0f11,#08090b)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;mix-blend-mode:soft-light;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .6 0'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>")}
aside{background:rgba(255,255,255,.02);backdrop-filter:blur(20px);border-right:1px solid var(--glb)}
.card,.st,.sched,.tw,.blk,.pb,.dn,.chip,.btn.ghost,.nms,.fx,.hr,.tk{background:var(--gl);border:1px solid var(--glb);box-shadow:var(--gls);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%)}
.card,.st,.sched,.tw,.blk,.pb{border-radius:22px;
 background-image:radial-gradient(circle at 12px 12px,rgba(255,255,255,.38) 0 2px,rgba(0,0,0,.35) 2.5px 3.5px,transparent 4px),radial-gradient(circle at calc(100% - 12px) 12px,rgba(255,255,255,.38) 0 2px,rgba(0,0,0,.35) 2.5px 3.5px,transparent 4px),radial-gradient(circle at 12px calc(100% - 12px),rgba(255,255,255,.38) 0 2px,rgba(0,0,0,.35) 2.5px 3.5px,transparent 4px),radial-gradient(circle at calc(100% - 12px) calc(100% - 12px),rgba(255,255,255,.38) 0 2px,rgba(0,0,0,.35) 2.5px 3.5px,transparent 4px),var(--gl)}
.st.a{background-image:radial-gradient(circle at 12px 12px,rgba(255,255,255,.5) 0 2px,rgba(0,0,0,.3) 2.5px 3.5px,transparent 4px),radial-gradient(circle at calc(100% - 12px) 12px,rgba(255,255,255,.5) 0 2px,rgba(0,0,0,.3) 2.5px 3.5px,transparent 4px),var(--tint);color:var(--ink);border-color:rgba(95,227,234,.35)}
.st.b{background-image:radial-gradient(circle at 12px 12px,rgba(255,255,255,.5) 0 2px,rgba(0,0,0,.3) 2.5px 3.5px,transparent 4px),radial-gradient(circle at calc(100% - 12px) 12px,rgba(255,255,255,.5) 0 2px,rgba(0,0,0,.3) 2.5px 3.5px,transparent 4px),linear-gradient(150deg,rgba(130,190,255,.20),rgba(70,130,220,.06) 70%);color:var(--ink);border-color:rgba(150,200,255,.3)}
.st.c{color:var(--ink)}
.st b{font-weight:400}.prog,.bars u{background:rgba(255,255,255,.12)}.prog i{background:linear-gradient(90deg,#5fe3ea,#a9f1f4)}.bars u.on{background:#5fe3ea}
.dn{border-radius:18px;box-shadow:var(--gls)}
.dn i{font-weight:400;letter-spacing:.01em}
.dn:hover,.dn:focus-visible,.dn.hoy{background:var(--tint);border-color:rgba(95,227,234,.5);color:var(--ink);box-shadow:var(--gls),0 0 34px rgba(95,227,234,.18)}
.dn.hoy i{color:var(--cy)}
.nms{background:none;border:0;box-shadow:none;backdrop-filter:none}
.dm{font-family:var(--f-m);letter-spacing:.08em;font-size:11px;text-transform:uppercase}
.nv2[aria-selected=true]{background:var(--tint);border:1px solid rgba(95,227,234,.4);color:var(--ink);box-shadow:var(--gls)}
nav.bn button[aria-selected=true]{background:var(--tint);color:var(--ink)}
.chp,.tag,.pill{background:rgba(255,255,255,.06);border:1px solid var(--glb);box-shadow:inset 0 1px 0 rgba(255,255,255,.14);backdrop-filter:blur(10px);font-family:var(--f-m);font-weight:400;letter-spacing:.06em;text-transform:uppercase;font-size:10px;color:var(--muted)}
.chp.v{background:rgba(95,227,234,.14);border-color:rgba(95,227,234,.35);color:var(--cy)}
.chp.p{background:rgba(255,255,255,.12);color:var(--ink)}.chp.h{background:rgba(150,200,255,.14);border-color:rgba(150,200,255,.3);color:var(--sky)}.chp.ok{background:rgba(61,220,132,.14);border-color:rgba(61,220,132,.35);color:var(--ok)}
.btn{background:var(--tint);color:var(--ink);border:1px solid rgba(95,227,234,.45);box-shadow:var(--gls);font-weight:500;border-radius:14px;backdrop-filter:blur(14px)}
.btn.ghost{background:var(--gl);border-color:var(--glb)}
.chip{border-radius:12px;font-weight:500}.chip[aria-pressed=true]{background:var(--tint);color:var(--ink);border-color:rgba(95,227,234,.45)}
input,select,textarea{background:rgba(255,255,255,.05);border:1px solid var(--glb);box-shadow:inset 0 1px 3px rgba(0,0,0,.4);backdrop-filter:blur(10px);color:var(--ink)}
.tw{overflow:hidden}
table{background:transparent}th{font-family:var(--f-m);font-weight:400;letter-spacing:.14em;color:var(--muted)}
td{border-bottom:1px solid rgba(255,255,255,.07)}
tr.cl:hover td{background:rgba(95,227,234,.05)}
.mini{border-color:rgba(255,255,255,.25);background:rgba(255,255,255,.04)}
.dbar{background:rgba(255,255,255,.08)}.dbar i{background:linear-gradient(90deg,#16b9c6,#8af0f5)}
.hd h1{font-weight:400;font-size:clamp(30px,4.6vw,46px)}.hd h1 span{font-style:italic}

.sl{border:1px solid var(--glb);box-shadow:var(--gls)}

  l.sort((a,b)=>fsort==="nuevo"?String(f.nuevo(b)).localeCompare(String(f.nuevo(a))):f[fsort](b)-f[fsort](a));
  $("#fn").textContent=l.length+" de "+cuentas.length+" resultados";
  $("#fl").innerHTML=l.map(c=>`<tr><td><b>${esc(c.u)}</b><div class="note">${esc(fuente(c))}</div></td><td style="min-width:220px">${esc(c.titulo)}<div class="note">${esc(c.porque||"")}</div></td><td><span class="chp ${c.tipo==="Reel"?"v":c.tipo==="Carrusel"?"h":"p"}">${esc(c.tipo)}</span></td><td style="min-width:120px"><span class="num">${(c.likes||0).toLocaleString("es-AR")}</span><div class="dbar"><i style="width:${Math.max(3,(c.likes||0)/maxL*100)}%"></i></div></td><td style="min-width:130px"><span class="num">${(c.coms||0).toLocaleString("es-AR")}</span>${(c.coms||0)>(c.likes||0)?' <span class="chp ok">más que likes</span>':""}<div class="dbar"><i style="width:${Math.max(3,(c.coms||0)/max*100)}%"></i></div></td><td style="white-space:nowrap">${c.url?`<a class="btn ghost sm" href="${esc(c.url)}" target="_blank" rel="noopener" style="text-decoration:none">Abrir</a> `:""}<button class="btn sm" data-ad="${esc(c.id)}">Adaptar</button></td></tr><tr id="adr-${esc(c.id)}" hidden><td colspan="6"><div class="res" id="ad-${esc(c.id)}"></div></td></tr>`).join("")||`<tr><td colspan="6"><div class="empty">No hay resultados. Probá con otra palabra.</div></td></tr>`;
  document.querySelectorAll("[data-ad]").forEach(b=>b.onclick=()=>adaptar(b.dataset.ad));
}
async function adaptar(id){const c=cuentas.find(x=>x.id===id),out=$("#ad-"+id);$("#adr-"+id).hidden=false;out.textContent="Pensando…";
  try{const s=await cuse("sample");if(!s){out.textContent=adaptLocal(c);return}
   await s(`Adaptá esta idea que funcionó en Instagram a Playskit (webs presskit a medida para DJs, entrega en 48 h, venta por chat; y un ebook de US$20 para escribirle a los sellos). Español rioplatense, corto, sin relleno. Idea: “${c.titulo}” de ${c.u} (${c.tipo}, ${c.likes} likes, ${c.coms} comentarios). Por qué funciona: ${c.porque}. Reglas: gancho que habla de un dolor, una emoción o un deseo del DJ; los primeros 5 segundos directos; CTA de una palabra con beneficio para el otro. Salida: GANCHO VERBAL, TEXTO EN PANTALLA, VISUAL, 4 VIÑETAS DE GUION, CTA.`,{onText:({text})=>{out.textContent=text}})}
  catch(e){out.textContent="⚠️ "+(e.message||"No se pudo adaptar.")}}
async function guardarCuenta(){const m=$("#nm");if(!db||!owner){m.textContent="⚠️ Solo la dueña puede sumar.";return}const u=$("#n-u").value.trim(),t=$("#n-t").value.trim();if(!u||!t){m.textContent="Falta la cuenta o lo que publicó.";return}
  const d={u:u.startsWith("@")?u:"@"+u,red:"Instagram",tipo:$("#n-k").value,titulo:t,likes:+$("#n-l").value||0,coms:+$("#n-c").value||0,porque:$("#n-p").value.trim(),url:$("#n-url").value.trim(),tags:(u+" "+t).toLowerCase(),fecha:iso(new Date())};
  try{await db.collection("cuentas").add(d);m.textContent="✅ Guardada.";["n-u","n-t","n-l","n-c","n-p","n-url"].forEach(i=>$("#"+i).value="")}catch(e){m.textContent="⚠️ No se pudo guardar."}}
async function pedirBusqueda(){const m=$("#pm"),t=$("#pq").value.trim()||"lo nuevo que esté funcionando con presskits y webs para DJs";if(!db||!owner){m.textContent="⚠️ Solo la dueña puede pedir.";return}
  try{await db.collection("pedidos").add({texto:"Buscar en Instagram y sumar a Qué funcionó: "+t,estado:"nuevo",respuesta:"",creado:Date.now()});m.textContent="✅ Pedido enviado. Decile a Claude: “mirá los pedidos”.";$("#pq").value=""}catch(e){m.textContent="⚠️ No se pudo enviar."}}
function pedList(){const el=$("#pl");if(!el)return;el.innerHTML=pedidos.slice(0,5).map(p=>`<div class="hr" style="margin-top:8px"><small>${p.estado==="listo"?"RESPONDIDO":"ESPERANDO"}</small>${esc(p.texto)}${p.respuesta?`<div class="note">${esc(p.respuesta)}</div>`:""}</div>`).join("")}
/* ---------- Crear ---------- */
function rGen(){
  $("#sub").textContent="Guiones con Claude e imágenes con Higgsfield";
  $("#t-gen").innerHTML=`<div class="two"><div class="card"><h2 class="s">1 · Guion con Claude</h2><label for="g-tema">Tema o detalle</label><input id="g-tema" placeholder="Ej: DJ de techno de Rosario sin web"><label for="g-fmt">Formato</label><select id="g-fmt"><option>Reel 15–25 seg</option><option>Carrusel 7 láminas</option><option>Historias 5 pantallas</option></select><label for="g-emo">Gancho de</label><select id="g-emo"><option>un dolor</option><option>una emoción</option><option>un deseo</option></select>
  <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="g-go">Escribir con Claude</button><button class="btn ghost" id="g-cc">Pedir a Claude Code</button></div><div class="res" id="g-out" hidden style="margin-top:10px"></div><p class="note" id="g-msg"></p></div>
  <div class="card"><h2 class="s">2 · Imagen o video en Higgsfield</h2><label for="h-tipo">Qué generar</label><select id="h-tipo"><option value="img">Imagen vertical</option><option value="vid">Video vertical 5 seg</option></select><label for="h-prompt">Descripción</label><textarea id="h-prompt" placeholder="Ej: DJ en cabina, luz celeste, estilo editorial, vertical"></textarea>
  <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost" id="h-bal">Ver créditos</button><button class="btn" id="h-cost">Cotizar</button></div><div class="res" id="h-out" hidden style="margin-top:10px"></div>
  <div id="h-ok" hidden><label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" id="h-chk" style="width:auto"> Sí, gastar esos créditos</label><button class="btn" id="h-go" disabled style="margin-top:8px">Generar</button></div><p class="note">Nunca gasta créditos sin cotizar y tildar la casilla.</p></div></div>
  <h2 class="s" style="margin-top:22px">Pedidos a Claude Code</h2><div id="pedidos"></div>`;
  drawPedidos();$("#g-go").onclick=genGuion;$("#g-cc").onclick=pedir;$("#h-bal").onclick=()=>hf("balance",{},r=>JSON.stringify(r,null,1));$("#h-cost").onclick=cotizar;$("#h-chk").onchange=e=>$("#h-go").disabled=!e.target.checked;$("#h-go").onclick=generar;
}
const brief=()=>`Tema: ${$("#g-tema").value.trim()||"webs presskit para DJs"}. Formato: ${$("#g-fmt").value}. El gancho habla de ${$("#g-emo").value} del DJ.`;
async function genGuion(){const out=$("#g-out"),msg=$("#g-msg");msg.textContent="";
  try{const s=await cuse("sample");if(!s){out.hidden=false;out.textContent=guionLocal();return}out.hidden=false;out.textContent="Pensando…";
   await s(`Sos guionista de contenido para Playskit (webs presskit a medida para DJs, entrega en 48 h, venta por chat; ebook de US$20 para escribirle a los sellos). Español rioplatense, corto, sin relleno. Reglas: los primeros 5 segundos directos y con emoción; usar “errores / métodos / trucos”, nunca “tips”; estructura gancho → problema → solución → prueba → CTA; CTA de una palabra con beneficio para el otro. ${brief()}\nSalida: GANCHO VERBAL, TEXTO EN PANTALLA, GANCHO VISUAL, ESCENAS (3 a 5 viñetas), CTA, PROMPT DE IMAGEN (1 línea).`,{onText:({text})=>{out.textContent=text}})}
  catch(e){msg.textContent="⚠️ "+(e.code==="not_granted"?"Falta permitir a Claude.":e.message||"No se pudo generar.")}}
async function pedir(){if(!db||!owner){$("#g-msg").textContent="⚠️ Solo la dueña puede pedir.";return}
  try{await db.collection("pedidos").add({texto:brief(),estado:"nuevo",respuesta:"",creado:Date.now()});$("#g-msg").textContent="✅ Pedido enviado. Decile a Claude Code: “mirá los pedidos”."}catch(e){$("#g-msg").textContent="⚠️ No se pudo enviar."}}
function drawPedidos(){const el=$("#pedidos");if(!el)return;el.innerHTML=pedidos.length?pedidos.map(p=>`<div class="card" style="margin-bottom:8px"><span class="chp ${p.estado==="listo"?"ok":""}">${p.estado==="listo"?"Respondido":"Esperando"}</span> <span class="note">${esc(p.texto)}</span>${p.respuesta?`<div class="res" style="margin-top:8px">${esc(p.respuesta)}</div>`:""}</div>`).join(""):`<div class="empty">Sin pedidos todavía.</div>`}
async function hf(tool,input,fmt,box){const out=box||$("#h-out");out.hidden=false;out.textContent="Consultando…";
  try{const m=await cuse("mcp");if(!m){out.textContent="⚠️ "+NOCL+"";return null}
   const r=await m.callTool("host:higgsfield",tool,input);out.textContent=fmt(r.payload??r.content);return r}
  catch(e){out.textContent=e.code==="server_not_connected"?"⚠️ Higgsfield no está conectado en esta app.":"⚠️ "+(e.code||"")+" "+(e.message||"");return null}}
let quoted=null,quotedTipo="img";
const hfTool=(t=$("#h-tipo").value)=>t==="vid"?"generate_video":"generate_image";
const hfParams=(p,t=$("#h-tipo").value)=>t==="vid"?{model:"seedance_2_5",prompt:p,aspect_ratio:"9:16",duration:5}:{model:"gpt_image_2",prompt:p,aspect_ratio:"9:16"};
async function cotizar(){const p=$("#h-prompt").value.trim();if(!p){$("#h-out").hidden=false;$("#h-out").textContent="⚠️ Escribí la descripción.";return}
  quoted=null;$("#h-ok").hidden=true;const r=await hf(hfTool(),{params:{...hfParams(p),get_cost:true}},x=>"Cotización:"+(typeof x==="string"?x:JSON.stringify(x,null,1)));
  if(r){quoted=p;quotedTipo=$("#h-tipo").value;$("#h-ok").hidden=false;$("#h-chk").checked=false;$("#h-go").disabled=true}}
async function generar(){if(!quoted||!$("#h-chk").checked)return;$("#h-go").disabled=true;
  await hf(hfTool(quotedTipo),{params:hfParams(quoted,quotedTipo)},x=>"Enviado a Higgsfield:"+(typeof x==="string"?x:JSON.stringify(x,null,1)));$("#h-ok").hidden=true;quoted=null}
/* ---------- arranque ---------- */
try{tab=localStorage.ps_tab||"cal";if(!TABS.some(t=>t[0]===tab))tab="cal"}catch(e){}
show();
const quiet=()=>!(document.activeElement&&/^(fq|pq|n-|g-|h-)/.test(document.activeElement.id||""));
const snap=(name,set,redraw)=>db.collection(name).onSnapshot(s=>{if(s.docs.length)set(s.docs.map(d=>({id:d.id,...d.data()})));if(quiet())redraw()},e=>console.error(e));
(async()=>{
  try{user=await cuse("user");db=await cuse("db");
    owner=!!(user&&user.isOwner&&user.isOwner());$("#who").textContent=owner?"dueña":"solo lectura";
    if(db){
      snap("posts",v=>posts=v,()=>{if(tab==="cal")rCal()});
      snap("cuentas",v=>cuentas=v,()=>{if(tab==="fx")fxList()});
      if(owner)snap("pedidos",v=>pedidos=v.sort((a,b)=>(b.creado||0)-(a.creado||0)),()=>{if(tab==="gen")drawPedidos();if(tab==="fx")pedList()});
    }
    if(!db)localMode();else show();
  }catch(e){console.error(e);localMode()}
})();
</script>
